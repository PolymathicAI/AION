[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
version = "0.0.1"
description = "AstronomIcal Omnimodal Network"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.4.0",
    "einops>=0.7.0",
    "huggingface_hub==0.24.7",
    "tokenizers>=0.15.2",
    "jaxtyping>=0.2.28",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = ["aion", "aion.fourm"]
